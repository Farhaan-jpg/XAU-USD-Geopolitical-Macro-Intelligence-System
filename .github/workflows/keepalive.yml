name: 24/7 Render Keep-Alive Cron

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          TARGET_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "RENDER_APP_URL secret is not set. Skipping keep-alive ping."
            exit 0
          fi
          echo "Pinging $TARGET_URL ..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL")
          echo "Response status: $STATUS_CODE"
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "Render service is awake and healthy!"
          else
            echo "Warning: Received HTTP $STATUS_CODE"
          fi
